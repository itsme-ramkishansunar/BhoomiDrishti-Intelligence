name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run audit:public
      - run: npm run smoke:public-ui-integrity
      - run: npm run smoke:public-demo-deployment
      - run: npm run build
