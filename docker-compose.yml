services:
  bhoomidrishti:
    build: .
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      SERVE_FRONTEND: "true"
      BACKEND_PORT: 8787
      BHOOMI_PERSISTENT_ROOT: /var/lib/bhoomidrishti/data
      BHOOMI_ADMIN_EMAIL: ${BHOOMI_ADMIN_EMAIL:?Set BHOOMI_ADMIN_EMAIL for production container}
      BHOOMI_ADMIN_PASSWORD: ${BHOOMI_ADMIN_PASSWORD:?Set BHOOMI_ADMIN_PASSWORD for production container}
      BHOOMI_DEMO_ACCESS_ENABLED: "false"
    volumes:
      - bhoomidrishti-data:/var/lib/bhoomidrishti/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  bhoomidrishti-data:
